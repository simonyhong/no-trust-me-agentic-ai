name: Temporary reliability validation
on:
  push:
    branches: [reliability-logging-jobs-watchdog]
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile source/brd_processor.py job_manager.py
      - name: Verify critical reliability primitives
        shell: bash
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from source import brd_processor as bp
          import job_manager as jm
          assert jm.FUNCTION_CALL_TIMEOUT_SECONDS >= 0
          assert hasattr(jm.JobManager, "_start_worker_log")
          assert hasattr(jm.JobManager, "_check_function_timeouts")
          assert hasattr(bp, "JobDataTemporarilyUnavailable")
          with tempfile.TemporaryDirectory() as d:
              path = Path(d) / "BRD_word_count_jobs.json"
              path.write_text('[{"incident_id":', encoding="utf-8")
              try:
                  bp.process_jobs(lambda x:x,
                      {"inputs":["text"],"incident_id":"incident_id",
                       "expected":"expected_word_count"}, path)
              except bp.JobDataTemporarilyUnavailable:
                  pass
              else:
                  raise AssertionError("Incomplete jobs file must be a data fault")
          print("PASS: watchdog, isolated logging, jobs-data fault classification")
          PY
