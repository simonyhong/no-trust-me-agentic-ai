name: Branch syntax check

on:
  push:
    branches: [hardening-review-fixes]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile job_manager.py source/brd_processor.py
