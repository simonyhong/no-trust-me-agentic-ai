name: Temporary generation timeout and cancellation race checks
on:
  push:
    branches: [generation-five-minutes-invocation-cancel-fix]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile source/brd_processor.py job_manager.py
      - name: Check timeout separation and cancellation ownership
        shell: bash
        run: |
          python - <<'PY'
          import ast, copy, logging, os, pathlib, time, uuid
          from types import SimpleNamespace
          from unittest.mock import patch
          from source import brd_processor as bp
          import job_manager as jm

          assert bp.GPT_GENERATION_REQUEST_TIMEOUT_SECONDS==300
          assert bp.GPT_GENERATION_TOOL_TIMEOUT_SECONDS==360
          response=SimpleNamespace(choices=[SimpleNamespace(message=SimpleNamespace(content='def foo(x): return x'))])
          observed=[]
          with patch.object(bp,'gpt_call_with_retry',side_effect=lambda *a, **k:(observed.append(k),response)[-1]):
              bp.ask_gpt_with_naming_convention_to_make_func(None,'Some BRD','foo',['x'])
          assert observed[0]['request_timeout_seconds']==300,observed
          assert observed[0]['tool_timeout_seconds']==360

          class Sem:
              n=0
              def acquire(self,timeout=None):self.n+=1;return True
              def release(self):self.n-=1
          sem=Sem();calls=[]
          def api(**kw):calls.append(kw);return response
          bp.gpt_client=SimpleNamespace(chat=SimpleNamespace(completions=SimpleNamespace(create=api)))
          bp.my_tools.gpt_model='test'
          bp.gpt_call_with_retry(sem,messages=[{'role':'user','content':'hi'}])
          assert abs(calls[-1]['timeout']-60)<1
          bp.gpt_call_with_retry(sem,request_timeout_seconds=300,tool_timeout_seconds=360,
                                 messages=[{'role':'user','content':'hi'}])
          assert abs(calls[-1]['timeout']-300)<1
          assert sem.n==0

          tree=ast.parse(pathlib.Path(bp.__file__).read_text(encoding='utf-8'))
          worker=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='process_single_brd_standalone')
          mark_node=next(n for n in ast.walk(worker) if isinstance(n,ast.FunctionDef) and n.name=='_mark_function_call')
          mod=ast.Module(body=[mark_node],type_ignores=[]);ast.fix_missing_locations(mod)
          brd=pathlib.Path('BRD_demo.txt');shared={}
          gl=dict(shared_data={'shared_dict':shared},brd_path=brd,os=os,time=time,uuid=uuid)
          exec(compile(mod,'marker','exec'),gl)
          mark=gl['_mark_function_call']
          fk=f'function_call::{brd.name}';ck=f'cancel::{brd.name}'
          mark('start','live_job')
          current=shared[fk]['invocation_id']
          shared[ck]={'pid':os.getpid(),'invocation_id':'obsolete','reason':'stale'}
          assert mark('check_cancel','live_job') is None
          shared[ck]={'pid':os.getpid(),'invocation_id':current,'reason':'stop'}
          assert mark('check_cancel','live_job')=='stop'
          mark('end','live_job')
          mark('start','live_job')
          assert mark('check_cancel','live_job') is None

          class CopyProxy(dict):
              def get(self,key,default=None):return copy.deepcopy(super().get(key,default))
              def __setitem__(self,key,value):
                  if key.startswith('cancel::'):
                      state=super().get(fk)
                      if state is not None:
                          new=dict(state);new['gpt_slot_held']=True
                          super().__setitem__(fk,new)
                  super().__setitem__(key,value)
          shared=CopyProxy()
          class Proc:
              pid=999
              killed=False
              def is_alive(self):return True
              def terminate(self):self.killed=True
              def join(self,timeout=None):pass
              def kill(self):self.killed=True
          proc=Proc()
          shared[fk]={'pid':999,'invocation_id':'inv1','phase':'live_job','paused':True,
              'gpt_slot_held':False,'started_monotonic':time.monotonic(),
              'wall_started_monotonic':time.monotonic()-50}
          manager=jm.JobManager.__new__(jm.JobManager)
          manager.active_processes=[proc];manager._pid_to_brd={999:brd}
          manager._timed_out_pids={};manager.shared_data={'shared_dict':shared}
          manager.logger=logging.getLogger('CI')
          with patch.object(jm,'FUNCTION_TOTAL_WALL_TIMEOUT_SECONDS',1.0):
              manager._check_function_timeouts()
              assert shared[fk]['gpt_slot_held'] is True
              assert shared[ck]['invocation_id']=='inv1'
              assert 'cancel_requested' not in shared[fk]
              manager._timed_out_pids[999]['requested_at']=time.monotonic()-10
              manager._check_function_timeouts()
              assert not proc.killed
              state=shared[fk];state['gpt_slot_held']=False;shared[fk]=state
              manager._check_function_timeouts()
              assert proc.killed
          print('PASS: 300s generation, 60s runtime, invocation ID isolation, and race-free GPT semaphore state')
          PY
