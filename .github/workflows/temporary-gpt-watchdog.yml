name: Temporary GPT watchdog regression
on:
  push:
    branches: [gpt-tool-watchdog-budget]
jobs:
  watchdog:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile source/brd_processor.py job_manager.py
      - name: Verify cumulative pause and external tool handling
        shell: bash
        run: |
          python - <<'PY'
          import ast, json, logging, os, pathlib, tempfile, time, types
          from unittest.mock import patch
          from source import brd_processor as bp
          import job_manager as jm
          assert jm.FUNCTION_CALL_TIMEOUT_SECONDS >= 0
          assert bp.GPT_TOOL_TIMEOUT_SECONDS > 0
          assert bp.GPT_REQUEST_TIMEOUT_SECONDS > 0

          module=ast.parse(pathlib.Path(bp.__file__).read_text(encoding="utf-8"))
          worker=next(n for n in module.body if isinstance(n,ast.FunctionDef) and n.name=="process_single_brd_standalone")
          mark=next(n for n in ast.walk(worker) if isinstance(n,ast.FunctionDef) and n.name=="_mark_function_call")
          one=ast.Module(body=[mark],type_ignores=[])
          ast.fix_missing_locations(one)
          brd_path=pathlib.Path("BRD_example.txt")
          state={};shared_data={"shared_dict":state}
          namespace=dict(os=os,time=time,brd_path=brd_path,shared_data=shared_data)
          exec(compile(one,"mark","exec"),namespace)
          cb=namespace["_mark_function_call"]
          clock=[100.0]
          with patch.object(bp.time,"monotonic",side_effect=lambda:clock[0]):
              cb("start","live_job");clock[0]+=3
              cb("pause","live_job")
              assert state["function_call::BRD_example.txt"]["paused"]
              clock[0]+=20
              cb("resume","live_job")
              clock[0]+=2.5
              elapsed=clock[0]-state["function_call::BRD_example.txt"]["started_monotonic"]
              assert abs(elapsed-5.5)<1e-6,elapsed
              cb("end","live_job")
              assert not state

          events=[]
          bp._active_function_watchdog=lambda event,phase:events.append((event,phase))
          bp._monitored_phase="live_job"
          bp._active_gpt_semaphore=object()
          response=types.SimpleNamespace(choices=[types.SimpleNamespace(message=types.SimpleNamespace(content="ok"))])
          with patch.object(bp,"gpt_call_with_retry",return_value=response):
              assert bp._generated_ask_gpt([{"role":"user","content":"hi"}])=="ok"
          assert events==[("pause","live_job"),("resume","live_job")],events
          events.clear()
          with patch.object(bp,"gpt_call_with_retry",side_effect=TimeoutError("service down")):
              try:bp._generated_ask_gpt([{"role":"user","content":"hi"}])
              except bp.ExternalGPTUnavailable:pass
              else:raise AssertionError("Expected external GPT service exception")
          assert events==[("pause","live_job"),("resume","live_job")],events
          bp._active_function_watchdog=None
          bp._monitored_phase=None
          bp._active_gpt_semaphore=None

          class Sem:
              def __init__(self):self.acq=0;self.rel=0
              def acquire(self,timeout=None):self.acq+=1;return True
              def release(self):self.rel+=1
          sem=Sem()
          api=types.SimpleNamespace(chat=types.SimpleNamespace(completions=types.SimpleNamespace(create=lambda **kw:response)))
          with patch.object(bp,"gpt_client",api),patch.object(bp.my_tools,"gpt_model","fake"):
              assert bp.gpt_call_with_retry(sem,messages=[{"role":"user","content":"hi"}]) is response
          assert sem.acq==sem.rel==1,(sem.acq,sem.rel)

          with tempfile.TemporaryDirectory() as d:
              jobs=pathlib.Path(d)/"BRD_word_count_jobs.json"
              done=pathlib.Path(d)/"done.json"
              jobs.write_text(json.dumps([{"incident_id":"A1","text":"hi","expected":2}]))
              def broken(text): raise bp.ExternalGPTUnavailable("Azure temporarily unavailable")
              try:bp.process_jobs(broken,
                  {"inputs":["text"],"incident_id":"incident_id","expected":"expected"},
                  jobs,done,output_contract={"type":"integer"},
                  input_specs=[{"name":"text","type":"string"}])
              except bp.ExternalGPTUnavailable:pass
              else:raise AssertionError("GPT outages must not count as function errors")
              assert json.loads(done.read_text())["ids"]==[]

          class Proc:
              pid=123456
              def is_alive(self):return True
              def terminate(self):raise AssertionError("Paused GPT call must not be killed")
          manager=jm.JobManager.__new__(jm.JobManager)
          manager.active_processes=[Proc()]
          manager._timed_out_pids={}
          manager._pid_to_brd={123456:brd_path}
          manager.shared_data={"shared_dict":{"function_call::BRD_example.txt":{
              "pid":123456,"phase":"live_job","paused":True,
              "started_monotonic":-999999.0,"elapsed_compute":500}}}
          manager.logger=logging.getLogger("watchdog-smoke")
          with patch.object(jm,"FUNCTION_CALL_TIMEOUT_SECONDS",1.0):
              manager._check_function_timeouts()
          assert not manager._timed_out_pids
          print("PASS: cumulative budget, GPT pause/resume, semaphore release and outage classification")
          PY
