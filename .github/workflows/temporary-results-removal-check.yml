name: Temporary results removal regression

on:
  push:
    branches: [remove-generated-results-files]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile job_manager.py source/brd_processor.py
      - name: Job results only in logs and done-state preserved
        run: |
          python - <<'PY'
          from source import brd_processor as bp
          import json, tempfile, logging
          from io import StringIO
          from pathlib import Path
          with tempfile.TemporaryDirectory() as d:
              root = Path(d)
              jobs = root / 'BRD_word_count_jobs.json'
              done = root / 'done_BRD_word_count_jobs.json'
              results = root / 'results_BRD_word_count_jobs.json'
              jobs.write_text(json.dumps([
                  {'incident_id': 'A1', 'text': 'hello world', 'expected_word_count': 2},
                  {'incident_id': 'A2', 'text': 'one two three'},
                  {'incident_id': 'BAD', 'text': 42, 'expected_word_count': 1},
              ]))
              calls = [0]
              def word_count(text):
                  calls[0] += 1
                  return len(text.split())
              common = {
                  'func': word_count,
                  'jobs_schema': {'inputs': ['text'], 'incident_id':'incident_id', 'expected':'expected_word_count'},
                  'jobs_path': jobs, 'done_file': done,
                  'output_contract': {'type':'integer'},
                  'input_specs':[{'name':'text','type':'string'}],
                  'compare_expected':True,
              }
              log = StringIO()
              h = logging.StreamHandler(log)
              bp.LOG.addHandler(h)
              bp.LOG.setLevel(logging.INFO)
              try:
                  success, reason = bp.process_jobs(**common)
                  assert success and reason is None
                  assert not results.exists()
                  state = json.loads(done.read_text())
                  assert state['ids'] == ['A1','A2']
                  assert len(state['rejected']) == 1
                  assert 'incident_id=A1: 2' in log.getvalue()
                  assert 'incident_id=A2: 3' in log.getvalue()
                  assert calls[0] == 2
                  success, reason = bp.process_jobs(**common)
                  assert success and calls[0] == 2
                  updated = json.loads(jobs.read_text())
                  updated.append({'incident_id':'A3','text':'four five','expected_word_count':99})
                  jobs.write_text(json.dumps(updated))
                  success, reason = bp.process_jobs(**common)
                  assert not success and 'wrong result' in reason
                  assert 'A3' not in json.loads(done.read_text())['ids']
                  assert not results.exists()
              finally:
                  bp.LOG.removeHandler(h)
          print('PASS: no results file, log retains answers, done/rejected state works')
          PY
      - name: Startup removes legacy results without resetting done
        run: |
          python - <<'PY'
          import tempfile, json
          from pathlib import Path
          import job_manager
          class NoOpManager:
              def __init__(self,*args,**kwargs): pass
              def run_continuous(self,**kwargs): pass
          with tempfile.TemporaryDirectory() as d:
              docs=Path(d)/'documents'
              docs.mkdir()
              old=docs/'results_BRD_word_count_jobs.json'
              old.write_text('{"results":{"A1":2}}')
              done=docs/'done_BRD_word_count_jobs.json'
              done.write_text('{"ids":["A1"]}')
              job_manager.PROJECT_ROOT=Path(d)
              job_manager.RESET_DONE_STATE=False
              job_manager.JobManager=NoOpManager
              job_manager.main()
              assert not old.exists()
              assert json.loads(done.read_text())['ids']==['A1']
          print('PASS: obsolete results deleted; completed-job markers retained')
          PY
