name: Temporary GPT configuration unblock tests
on:
  push:
    branches: [gpt-config-restart-unblock]
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile source/brd_processor.py job_manager.py
      - name: Verify transient config blocks and persistent real blocks
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, tempfile
          from source import brd_processor as bp

          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d)/"registry.json"
              legacy="AAAAAAA1"
              bp.block_brd_until_changed(p,legacy,"BRD_one.txt","key expired",
                  origin="gpt_service_configuration")
              # Existing configuration-only blocks must no longer prevent a restart.
              assert bp.get_brd_runtime_block(p,legacy) is None
              assert bp.load_registry(p)[legacy]["runtime_block"]["origin"]=="gpt_service_configuration"
              # Any real BRD failure replaces legacy metadata.
              bp.block_brd_until_changed(p,legacy,"BRD_one.txt","bad runtime answer",
                  origin="live_job_failure")
              assert bp.get_brd_runtime_block(p,legacy)["origin"]=="live_job_failure"
              # Genuine failure remains durable and cannot be overwritten.
              bp.block_brd_until_changed(p,legacy,"BRD_one.txt","extra failure",
                  origin="generation_exhausted")
              assert bp.get_brd_runtime_block(p,legacy)["origin"]=="live_job_failure"
              other="AAAAAAA2"
              bp.block_brd_until_changed(p,other,"BRD_two.txt","ten failures",
                  origin="generation_exhausted")
              assert bp.get_brd_runtime_block(p,other)["origin"]=="generation_exhausted"

          source=pathlib.Path(bp.__file__).read_text(encoding="utf-8")
          tree=ast.parse(source)
          worker=next(x for x in tree.body if isinstance(x,ast.FunctionDef)
                      and x.name=="process_single_brd_standalone")
          handlers=[h for node in ast.walk(worker) if isinstance(node,ast.Try)
                    for h in node.handlers
                    if isinstance(h.type,ast.Name) and h.type.id=="GPTServiceConfigurationError"]
          assert len(handlers)==1,handlers
          call_names=[node.func.id for node in ast.walk(handlers[0])
                      if isinstance(node,ast.Call) and isinstance(node.func,ast.Name)]
          assert "block_brd_until_changed" not in call_names
          assert "module_logger" not in call_names or "module_logger" in source
          print("PASS: configuration-only blocks clear on restart; real BRD blocks persist")
          PY
