name: Temporary scheduler fairness regression
on:
  push:
    branches: [fair-oldest-served-brd-scheduling]
jobs:
  scheduler:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile job_manager.py source/brd_processor.py tests/test_scheduler_fairness.py
      - name: Busy BRDs and pending retry regression
        run: python tests/test_scheduler_fairness.py
