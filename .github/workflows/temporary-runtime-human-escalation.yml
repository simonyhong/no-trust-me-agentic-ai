name: Temporary runtime human-escalation test
on:
  push:
    branches: [human-escalation-runtime-failures]
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile job_manager.py source/brd_processor.py
      - name: Real-job exception blocks without GPT and persists across restart
        run: |
          python - <<'PY'
          import json, logging, multiprocessing, pathlib, tempfile, time
          from source import brd_processor as bp

          brd_text = (
            "Test BRD\n"
            "4. FUNCTION INPUT/OUTPUT CONTRACT\n"
            "---------------------------------\n"
            '{"input":[{"name":"text","type":"string"}],"output":{"type":"integer"}}\n'
            "5. TEST EXAMPLES & EXPECTED RESULTS\n"
            "-----------------------------------\n"
            '[{"input":"hello world","output":2}]\n'
            "6. JOBS DATA STRUCTURE\n"
            "----------------------\n"
            "ID_FIELD=incident_id\n"
            "EXPECTED_FIELD=expected_word_count\n"
            "N_ITEMS_TO_PASS=1\n"
          )
          with tempfile.TemporaryDirectory() as d:
              root=pathlib.Path(d)
              docs=root/"documents"; docs.mkdir()
              brd=docs/"BRD_word_count.txt"
              brd.write_text(brd_text,encoding="utf-8")
              (docs/"BRD_word_count_jobs.json").write_text(json.dumps([
                  {"incident_id":"A1","text":"hello world","expected_word_count":2},
                  {"incident_id":"A2","text":"hello world again","expected_word_count":3}
              ]),encoding="utf-8")
              saved=root/"saved_functions"; saved.mkdir()
              hc=saved/"BRD_word_count_handcrafted"; hc.mkdir()
              (hc/"implementation.py").write_text("def word_count(text):\n    return 2\n",encoding="utf-8")
              reg=saved/"registry.json"
              manager=multiprocessing.Manager()
              shared=manager.dict({"hb":{"ts":time.time()}})
              shared_data={"shared_dict":shared,"lock":manager.Lock()}
              p=multiprocessing.Process(target=bp.process_single_brd_standalone,
                  args=(brd,saved,reg,multiprocessing.BoundedSemaphore(2),
                        multiprocessing.Queue(),shared_data,False,1))
              p.start()
              hash_=bp.brd_hash_signature(brd_text)
              block=None
              for _ in range(120):
                  block=bp.get_brd_runtime_block(reg,hash_)
                  if block: break
                  time.sleep(.1)
              shared["stop::BRD_word_count.txt"]=True
              p.join(10)
              if p.is_alive():
                  p.terminate(); p.join(5)
                  raise AssertionError("Worker did not stop")
              assert block and block["origin"]=="live_job_failure",block
              q=bp.load_registry(reg)[hash_]["quarantine"]
              assert q and q[0]["origin"]=="handcrafted"
              assert "A1" in json.loads((docs/"done_BRD_word_count_jobs.json").read_text())["ids"]
              assert "A2" not in json.loads((docs/"done_BRD_word_count_jobs.json").read_text())["ids"]
              assert bp.get_brd_runtime_block(reg,hash_)==block
              assert bp.get_brd_runtime_block(reg,bp.brd_hash_signature(brd_text+"changed")) is None
              manager.shutdown()
          print("PASS: first real-job failure is quarantined and permanently blocked for that hash")
          PY
      - name: Unexpected worker exit gets human-review block
        run: |
          python - <<'PY'
          import pathlib, tempfile, logging
          import job_manager
          from source import brd_processor as bp
          class Finished:
              pid=12345
              exitcode=1
              def is_alive(self): return False
              def join(self,timeout=None): pass
              def close(self): pass
          with tempfile.TemporaryDirectory() as d:
              root=pathlib.Path(d)
              brd=root/"BRD_word_count.txt"; brd.write_text("A BRD")
              reg=root/"registry.json"
              original_registry=job_manager.REGISTRY
              try:
                  job_manager.REGISTRY=reg
                  import threading
                  j=job_manager.JobManager.__new__(job_manager.JobManager)
                  j.logger=logging.getLogger("test-manager")
                  j.active_processes=[Finished()]
                  j._pid_to_brd={12345:brd}
                  signature=bp.brd_hash_signature(brd.read_text())
                  j._pid_to_brd_hash={12345:signature}
                  j._inflight_brds={brd}
                  j.shared_data={"shared_dict":{},"lock":threading.Lock()}
                  j._cleanup_finished()
                  block=bp.get_brd_runtime_block(reg,signature)
                  assert block and block["origin"]=="unexpected_worker_exit",block
                  assert not j._inflight_brds and not j._pid_to_brd_hash
              finally:
                  job_manager.REGISTRY=original_registry
          print("PASS: failed worker process blocks same BRD content hash")
          PY
